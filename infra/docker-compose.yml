name: stockpro 

services:
  postgres:
    image: postgres:17-alpine
    container_name: stockpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpro
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: stockpro_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U stockpro -d stockpro_db
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockpro-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  minio-dev:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: stockproadmin
      MINIO_ROOT_PASSWORD: stockprodev123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r response <&3;
          [[ "$$response" == *" 200 "* ]]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
  redis_data:
  minio_data:

